<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Commio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="brand-logo.css">
    <link rel="stylesheet" href="sidebar.css">

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: #102d3d;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f9fc;
        }

        .app {
            min-height: 100vh;
            display: flex;
            position: relative;
            isolation: isolate;
            background:
                radial-gradient(circle at 85% 22%, rgba(178, 231, 239, 0.32), transparent 30%),
                radial-gradient(circle at 18% 72%, rgba(190, 235, 207, 0.30), transparent 32%),
                radial-gradient(circle at 72% 5%, rgba(255, 239, 176, 0.22), transparent 25%),
                linear-gradient(135deg, #f5fbf6 0%, #f1faf8 35%, #f0f9fc 68%, #fffdf4 100%);
        }

        .profile-main {
            flex: 1;
            min-width: 0;
            padding: 42px 48px 70px;
            position: relative;
            z-index: 1;
        }

        .profile-content {
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
        }

        .page-heading {
            margin-bottom: 25px;
        }

        .eyebrow {
            margin-bottom: 8px;
            color: #0da99d;
            font-size: 10px;
            font-weight: 750;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .page-heading h1 {
            margin: 0;
            font-size: 29px;
            line-height: 1.15;
        }

        .page-heading p {
            margin: 8px 0 0;
            color: #718894;
            font-size: 14px;
            line-height: 1.5;
        }

        .edit-button {
            min-height: 36px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #078f89;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #c9e8e4;
            border-radius: 10px;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
        }

        .edit-button:hover {
            background: white;
            border-color: #8dd4c8;
            transform: translateY(-1px);
        }

        .edit-button svg {
            width: 15px;
            height: 15px;
        }

        /* Wider, centered, light pastel yellow profile section */
        .profile-grid {
            width: 100%;
            max-width: 1040px;
            margin: 0 auto; /* Center the profile box */
        }

        .profile-section {
            width: 100%;
            min-width: 0;
            padding: 28px 30px;
            /* Light pastel yellowish/orangeish color matching background */
            background: rgba(255, 253, 244, 0.85); 
            border: 1px solid #f2e9d2;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(37, 76, 91, 0.05);
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .section-heading {
            margin: 0;
            color: #173445;
            font-size: 16px;
            font-weight: 750;
        }

        .identity {
            min-height: 76px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile-avatar {
            width: 56px;
            height: 56px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            color: #bf7046;
            background: linear-gradient(
                135deg,
                #fff0e5,
                #f9e8dc
            );
            border: 1px solid #efd5c3;
            border-radius: 50%;
        }

        .profile-avatar svg {
            width: 25px;
            height: 25px;
            stroke: #bf7046;
        }

        .identity h3 {
            margin: 0;
            color: #173445;
            font-size: 17px;
            font-weight: 750;
        }

        .identity p {
            margin: 4px 0 0;
            color: #718894;
            font-size: 11px;
        }

        .detail-list {
            margin: 0;
        }

        .detail-row {
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            border-top: 1px solid #eeeada;
            font-size: 12px;
        }

        .detail-row dt {
            color: #718894;
        }

        .detail-row dd {
            margin: 0;
            color: #294653;
            font-weight: 650;
            text-align: right;
            overflow-wrap: anywhere;
        }

        .edit-dialog {
            width: min(480px, calc(100vw - 28px));
            max-width: none;
            padding: 0;
            color: #102d3d;
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid #dce9ee;
            border-radius: 16px;
            box-shadow: 0 24px 70px rgba(25, 65, 82, 0.22);
        }

        .edit-dialog::backdrop {
            background: rgba(16, 45, 61, 0.34);
            backdrop-filter: blur(4px);
        }

        .edit-form {
            padding: 24px;
        }

        .dialog-heading {
            margin: 0 0 18px;
            color: #173445;
            font-size: 18px;
        }

        .form-field {
            margin-top: 13px;
            display: grid;
            gap: 6px;
        }

        .form-field label {
            color: #526e7b;
            font-size: 11px;
            font-weight: 650;
        }

        .form-field input,
        .form-field select {
            width: 100%;
            min-height: 40px;
            padding: 0 11px;
            color: #294653;
            background: white;
            border: 1px solid #dce9ee;
            border-radius: 9px;
            font: inherit;
            font-size: 12px;
        }

        .form-field input:focus,
        .form-field select:focus {
            outline: 2px solid rgba(15, 167, 121, 0.22);
            border-color: #74cbb8;
        }

        .dialog-actions {
            margin-top: 22px;
            display: flex;
            justify-content: flex-end;
            gap: 9px;
        }

        .dialog-actions button {
            min-height: 38px;
            padding: 0 13px;
            border: 1px solid #dce9ee;
            border-radius: 9px;
            font: inherit;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .cancel-button {
            color: #526e7b;
            background: white;
        }

        .save-button {
            color: white;
            background: linear-gradient(100deg, #0fc78f, #0bb7df);
            border-color: transparent !important;
        }

        @media (max-width: 1100px) {
            .profile-grid {
                max-width: 100%;
            }
        }

        @media (max-width: 900px) {
            .profile-main {
                padding: 34px 28px 54px;
            }

            .profile-section {
                padding: 25px;
            }
        }

        @media (max-width: 650px) {
            .profile-main {
                padding: 72px 18px 40px;
            }

            .profile-section {
                padding: 20px 18px;
                border-radius: 16px;
            }

            .detail-row {
                gap: 12px;
            }
        }
    </style>
</head>

<body>

<div class="app profile-app">

    <div data-shared-sidebar></div>

    <main class="profile-main">

        <div class="profile-content">

            <header class="page-heading">
                <div>
                    <div class="eyebrow">ACCOUNT</div>
                    <h1>Profile</h1>
                    <p>Your account and communication preferences.</p>
                </div>
            </header>

            <div class="profile-grid">

                <section class="profile-section" aria-labelledby="profileSectionTitle">

                    <div class="section-header">
                        <h2 class="section-heading" id="profileSectionTitle">
                            Profile
                        </h2>

                        <button class="edit-button" id="editProfileButton" type="button">
                            <i data-lucide="pencil"></i>
                            <span>Edit Profile</span>
                        </button>
                    </div>

                    <div class="identity">

                        <div class="profile-avatar" aria-hidden="true">
                            <i data-lucide="user-round"></i>
                        </div>

                        <div>
                            <h3 data-profile-value="fullName">
                                Reem Mousa
                            </h3>

                            <p>Personal account</p>
                        </div>

                    </div>

                    <dl class="detail-list">

                        <div class="detail-row">
                            <dt>Full name</dt>
                            <dd data-profile-value="fullName">
                                Reem Mousa
                            </dd>
                        </div>

                        <div class="detail-row">
                            <dt>Username</dt>
                            <dd data-profile-value="username">
                                Not set
                            </dd>
                        </div>

                        <div class="detail-row">
                            <dt>Email address</dt>
                            <dd data-profile-value="email">
                                Not provided
                            </dd>
                        </div>

                        <div class="detail-row">
                            <dt>Account type</dt>
                            <dd>Personal</dd>
                        </div>

                        <div class="detail-row">
                            <dt>Member since</dt>
                            <dd>2025</dd>
                        </div>

                    </dl>

                </section>

            </div>

            <dialog class="edit-dialog" id="editProfileDialog" aria-labelledby="editProfileTitle">

                <form class="edit-form" id="editProfileForm">

                    <h2 class="dialog-heading" id="editProfileTitle">
                        Edit Profile
                    </h2>

                    <div class="form-field">
                        <label for="editFullName">
                            Full name
                        </label>
                        <input
                            id="editFullName"
                            name="fullName"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="form-field">
                        <label for="editUsername">
                            Username
                        </label>
                        <input
                            id="editUsername"
                            name="username"
                            autocomplete="username"
                        >
                    </div>

                    <div class="form-field">
                        <label for="editEmail">
                            Email address
                        </label>
                        <input
                            id="editEmail"
                            name="email"
                            type="email"
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-field">
                        <label for="editPracticeType">
                            Preferred practice type
                        </label>
                        <select id="editPracticeType" name="practiceType">
                            <option>
                                Presentation and interview
                            </option>
                            <option>
                                Presentation
                            </option>
                            <option>
                                Interview
                            </option>
                        </select>
                    </div>

                    <div class="dialog-actions">
                        <button
                            class="cancel-button"
                            id="cancelProfileEdit"
                            type="button">
                            Cancel
                        </button>

                        <button
                            class="save-button"
                            type="submit">
                            Save changes
                        </button>
                    </div>

                </form>

            </dialog>

        </div>

    </main>

</div>

<script src="sidebar.js"></script>

<script>
    const defaultProfile = {
        fullName: "Reem Mousa",
        username: "",
        email: sessionStorage.getItem("commioUser") || ""
    };

    let profileData = defaultProfile;

    try {
        profileData = {
            ...defaultProfile,
            ...JSON.parse(
                sessionStorage.getItem("commioProfile") || "{}"
            )
        };
    } catch {
        profileData = defaultProfile;
    }

    const dialog = document.getElementById("editProfileDialog");
    const form = document.getElementById("editProfileForm");

    function renderProfile() {
        document
            .querySelectorAll("[data-profile-value]")
            .forEach(element => {
                const key = element.dataset.profileValue;
                const value = profileData[key];

                element.textContent =
                    value && String(value).trim()
                        ? String(value).trim()
                        : "Not provided";
            });
    }

    function openProfileEditor() {
        form.elements.fullName.value = profileData.fullName || "";
        form.elements.username.value = profileData.username || "";
        form.elements.email.value = profileData.email || "";

        dialog.showModal();
    }

    document
        .getElementById("editProfileButton")
        .addEventListener("click", openProfileEditor);

    document
        .getElementById("cancelProfileEdit")
        .addEventListener("click", () => dialog.close());

    form.addEventListener("submit", event => {
        event.preventDefault();

        profileData = {
            ...profileData,
            fullName: form.elements.fullName.value.trim(),
            username: form.elements.username.value.trim(),
            email: form.elements.email.value.trim()
        };

        sessionStorage.setItem(
            "commioProfile",
            JSON.stringify(profileData)
        );

        renderProfile();
        dialog.close();
    });

    renderProfile();
    lucide.createIcons();
</script>

</body>
</html>
