<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Commio</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <header class="auth-header">
        <a href="index.html" class="auth-logo" aria-label="Commio home">
            <img src="logo.png" alt="Commio" class="site-logo">
        </a>
    </header>

    <main class="auth-wrap">
        <section class="card">

            <h1>Access Your Workspace</h1>
            <p class="sub">Enter your credentials to load your active analysis matrices and coach indexes.</p>

            <div class="tabs" role="tablist">
                <button class="tab" role="tab" id="tab-personal" data-tab="personal" aria-selected="true">Personal Account</button>
                <button class="tab" role="tab" id="tab-org" data-tab="org" aria-selected="false">Organization Portal</button>
            </div>

            <form id="signinForm" novalidate>

                <div class="field" id="emailField">
                    <label for="email" id="emailLabel">Authorized Email Address</label>
                    <div class="input-wrap">
                        <input type="email" id="email" autocomplete="email" placeholder="you@example.com" required>
                    </div>
                    <p class="error">Please enter a valid email address</p>
                </div>

                <div class="field" id="pwField">
                    <div class="label-row">
                        <label for="password">Password</label>
                        <a href="#" class="forgot" id="forgot">Forgot Password?</a>
                    </div>
                    <div class="input-wrap">
                        <input type="password" id="password" autocomplete="current-password" required>
                        <button type="button" class="toggle-pw" data-toggle="password" aria-label="Show password">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <p class="error">Please enter your password</p>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span class="spinner"></span>
                    <span id="submitText">Sign In</span>
                </button>

            </form>

            <div class="divider">OR</div>

            <p class="foot" id="foot">
                <span id="footText">New to Commio?</span>
                <a href="register.html" id="footLink">Create account</a>
            </p>

            <p class="notice" id="notice" role="status"></p>

        </section>
    </main>

    <script src="auth.js"></script>
</body>
</html>
